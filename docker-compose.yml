
services:

  postgres:
    image: postgres:15.8-alpine
    container_name: delivery_postgres
    restart: unless-stopped
    init: true

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 1g
    cpus: 1.0

    networks:
      - delivery_network

  redis:
    image: redis:7.2-alpine
    container_name: delivery_redis
    restart: unless-stopped
    init: true

    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 512m
    cpus: 0.5

    networks:
      - delivery_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runner

    container_name: delivery_server
    restart: unless-stopped
    init: true

    stop_grace_period: 30s

    volumes:
      - uploads_data:/app/uploads

    # Injects EVERY key from the root .env file automatically
    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5000
      DB_SYNC: "false"

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d

      CLIENT_URL: ${CLIENT_URL}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 1g
    cpus: 1.0

    security_opt:
      - no-new-privileges:true

    networks:
      - delivery_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY}

    container_name: delivery_client
    restart: unless-stopped
    init: true

    stop_grace_period: 30s

    depends_on:
      server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 1g
    cpus: 1.0

    security_opt:
      - no-new-privileges:true

    networks:
      - delivery_network

  nginx:
    image: nginx:alpine  # Fixed tag version

    container_name: delivery_nginx
    restart: unless-stopped
    init: true

    depends_on:
      - server
      - client

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # - certbot_data:/var/www/certbot
      - ./certbot/www:/var/www/certbot

    read_only: true

    tmpfs:
      - /var/cache/nginx
      - /var/run

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 256m
    cpus: 0.5

    security_opt:
      - no-new-privileges:true

    networks:
      - delivery_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_data:

networks:
  delivery_network:
    driver: bridge