name: Build DeliverPro Backend & Deploy to EC2

on:
  push:
    branches:
      - main  # Runs automatically on push to main branch

jobs:
  # JOB 1: Build Docker Image on GitHub Actions (Free RAM/CPU) and push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  # Reused token from Pushtaklekhan

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/deliverpro-backend:latest

  # JOB 2: Trigger EC2 via SSH to Pull Pre-built Image & Restart Container
  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to your DeliverPro backend directory on EC2
            cd ~/deliverpro
            
            # 2. Fetch updated docker-compose or config files safely
            git reset --hard HEAD
            git pull origin main
            
            # 3. Pull the pre-built backend image from Docker Hub
            docker compose pull server
            
            # 4. Restart server container without compiling on EC2
            docker compose up -d server
            
            # 5. Run database migrations inside the server container
            docker exec delivery_server npm run migrate || true
            
            # 6. Clean unused Docker image layers to save disk space
            docker image prune -f