worker_processes auto;

events { 
    worker_connections 1024; 
}

http {
    # ── MIME Types (Required for CSS/JS assets) ─────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance & Compression ────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 250;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Security Headers ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Rate Limiting Zones ──────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
    limit_req_status 429;

    # ── Upstream Connections ──────────────────────────────
    upstream backend {
        server delivery_server:5000;
        keepalive 32;
    }

    upstream frontend {
        server delivery_client:3000;
        keepalive 32;
    }

    # ── HTTP Server (Let's Encrypt + HTTPS Redirect) ─────
    server {
        listen 80;
        server_name spmeshram.tech www.spmeshram.tech;

        # Allow Let's Encrypt automated verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
